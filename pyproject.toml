[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firma-pricing"
version = "0.1.0"
description = "Pricing toolkit for HLZ line boxes"
readme = "README.md"
authors = [{name = "Firma"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
